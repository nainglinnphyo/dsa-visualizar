<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive, step-by-step visualizations of data structures and algorithms."
    />
    <title>DSA Visualizer</title>
    <script>
      // Resolve the theme before first paint so there is no flash of the
      // wrong palette. Mirrors resolveTheme() in src/theme/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('dsa-visualizer:theme');
          var preference =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'system';
          var resolved =
            preference === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : preference;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (error) {
          // Storage or matchMedia unavailable: the dark default in the markup stands.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
